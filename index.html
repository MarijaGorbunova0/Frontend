<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Games Table with Vue + API</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
        crossorigin="anonymous">
</head>
<body>

<div id="app">
  <table id="gamesTable" class="table table-striped table-bordered">
    <thead>
    <tr>
      <th>Name</th>
      <th>Price</th>
    </tr>
    </thead>
    <tbody>
    <tr v-for="game in games" :key="game.id">
      <td>{{ game.name }}</td>
      <td>{{ game.price }}</td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>

<script src="https://unpkg.com/vue@3.2.47/dist/vue.global.js"></script>

<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        games: []
      }
    },

    async created() {
      try {
        const response = await fetch('http://localhost:8080/games');

        if (!response.ok) {
          throw new Error(`HTTP eror! status: ${response.status}`);
        }

        const data = await response.json();
        this.games = data;
        console.log('Games loaded from API:', data);
      } catch (error) {
        console.error("Error loading games from API:", error);
      }
    }
  }).mount('#app');
</script>

</body>
</html>
