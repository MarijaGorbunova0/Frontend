<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Games List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="app">

  <div class="container mt-4">
    <div class="card">
      <div class="card-header">
        <h5 class="card-title">Add New Game</h5>
      </div>
      <div class="card-body">
        <form @submit.prevent="addGame">
          <div class="row">
            <div class="col-md-6">
              <div class="mb-3">
                <label for="gameName" class="form-label">Game Name</label>
                <input type="text" class="form-control" id="gameName" v-model="newGame.name" required>
              </div>
            </div>
            <div class="col-md-6">
              <div class="mb-3">
                <label for="gamePrice" class="form-label">Price</label>
                <input type="number" step="0.01" class="form-control" id="gamePrice" v-model="newGame.price" required>
              </div>
            </div>
          </div>
          <button type="submit" class="btn btn-success">Add Game</button>
        </form>
      </div>
    </div>
  </div>
  <div class="container mt-4">
    <table class="table table-striped table-bordered">
      <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Price</th>
      </tr>
      </thead>
      <tbody>
      <tr v-for="game in games" :key="game.id">
        <td @click="getGame(game.id)" style="cursor: pointer; color: #0d6efd; text-decoration: underline;">
          {{ game.name }}
        </td>
        <td>${{ game.price.toFixed(2) }}</td>
      </tr>
      </tbody>
    </table>
  </div>

  <div id="gameInfoModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Game Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <table class="table table-striped">
            <tr>
              <th>ID</th>
              <td>{{ gameInModal.id }}</td>
            </tr>
            <tr>
              <th>Name</th>
              <td>{{ gameInModal.name }}</td>
            </tr>
            <tr>
              <th>Price</th>
              <td>${{ gameInModal.price }}</td>
            </tr>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script>
  const { createApp } = Vue;

  createApp({
    data() {
      return {
        gameInModal: { name: '', price: '', id: '' },
        games: [],
        newGame: {
          name: '',
          price: ''
        }
      }
    },
    async created() {
      await this.loadGames();
    },
    methods: {
      async loadGames() {
        try {
          const response = await fetch('http://localhost:8080/games');
          if (response.ok) {
            this.games = await response.json();
          } else {
            console.error('Failed to load games');
          }
        } catch (error) {
          console.error('Error loading games:', error);
        }
      },
      async getGame(id) {
        try {
          const response = await fetch(`http://localhost:8080/games/${id}`);
          if (response.ok) {
            this.gameInModal = await response.json();
            const modal = new bootstrap.Modal(document.getElementById('gameInfoModal'));
            modal.show();
          }
        } catch (error) {
          console.error('Error loading game details:', error);
        }
      },

      async addGame() {
        if (!this.newGame.name || !this.newGame.price) {
          alert('Please fill in all fields');
          return;
        }

        try {
          const response = await fetch('http://localhost:8080/games', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              name: this.newGame.name,
              price: parseFloat(this.newGame.price)
            })
          });

          if (response.ok) {
            this.newGame.name = '';
            this.newGame.price = '';

            await this.loadGames();

            alert('Game added successfully!');
          } else {
            const errorData = await response.json();
            alert('Error adding game: ' + (errorData.error || 'Unknown error'));
          }
        } catch (error) {
          console.error('Error adding game:', error);
          alert('Error adding game: ' + error.message);
        }
      }
    }
  }).mount('#app');
</script>
</body>
</html>
